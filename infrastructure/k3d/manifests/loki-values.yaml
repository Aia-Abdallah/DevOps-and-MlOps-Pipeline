# Small, monolithic Loki install for the CISC-814 k3d lecture cluster.
# This is intentionally a teaching/dev setup, not a production Loki design.
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 2h
  ruler:
    enable_api: true

minio:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

deploymentMode: Monolithic

singleBinary:
  replicas: 1
  persistence:
    size: 1Gi

# Keep every non-monolithic component disabled so students can reason about
# one Loki process plus the gateway service. Filesystem storage is enough for
# this short-lived k3d demo.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
